{% extends "base.html" %}

{% block title %}Admin Dashboard - BloodLife{% endblock %}

{% block content %}
<!-- ============================================================
     ADMIN DASHBOARD PAGE
     Protected page for admins to view stats, add donors,
     and delete existing donor records.
============================================================ -->
<section class="dashboard-section" aria-label="Admin dashboard">
    <div class="container">
        
        <!-- Dashboard Top Header Bar -->
        <div class="dashboard-top">
            
            <!-- Quick Actions: Add Donor and Logout -->
            <div class="dashboard-actions">
                <button class="btn btn-primary" id="openModalBtn" type="button">
                    + Add Donor
                </button>
                <button 
                    type="button" 
                    onclick="fetch('/api/logout', {method:'POST'}).then(function(){ window.location='/admin'; })" 
                    class="btn btn-ghost"
                >
                    Logout
                </button>
            </div>

            <!-- Metric Statistics Cards -->
            <div class="dashboard-stats">
                <div class="stat-inline">
                    <span class="stat-number-inline" id="dTotal">--</span>
                    <span class="stat-label-inline">Total Donors</span>
                </div>
                <div class="stat-inline">
                    <span class="stat-number-inline" id="dAvail">--</span>
                    <span class="stat-label-inline">Available</span>
                </div>
            </div>

        </div>

        <!-- Donors Management Table -->
        <div class="table-container">
            <table class="data-table">
                <!-- Column widths definition -->
                <colgroup>
                    <col class="col-id">
                    <col class="col-name">
                    <col class="col-blood">
                    <col class="col-phone">
                    <col class="col-email">
                    <col class="col-age">
                    <col class="col-gender">
                    <col class="col-location">
                    <col class="col-msg">
                    <col class="col-actions">
                </colgroup>
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Name</th>
                        <th scope="col">Blood</th>
                        <th scope="col">Phone</th>
                        <th scope="col">Email</th>
                        <th scope="col">Age</th>
                        <th scope="col">Gender</th>
                        <th scope="col">Location</th>
                        <th scope="col">Message</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <!-- Table rows populated dynamically by script.js -->
                <tbody id="donorsBody">
                    <tr>
                        <td colspan="10" class="loading">Loading donor records...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</section>

<!-- ============================================================
     MODAL DIALOG: ADD NEW DONOR (ADMIN)
     Popup form to quickly create a donor from within the dashboard.
============================================================ -->
<div class="modal hidden" id="addModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-content">
        
        <!-- Modal Close Button -->
        <button class="modal-close" id="modalClose" type="button" aria-label="Close dialog">&times;</button>
        
        <h2 id="modalTitle">Add New Donor</h2>
        
        <form id="addForm">
            <!-- Name -->
            <div class="form-group">
                <label for="a_name">Name <span class="req">*</span></label>
                <input type="text" id="a_name" required placeholder="Full Name">
            </div>

            <!-- Blood Group -->
            <div class="form-group">
                <label for="a_blood">Blood Group <span class="req">*</span></label>
                <select id="a_blood" required>
                    <option value="">Select Blood Group</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </div>

            <!-- Phone -->
            <div class="form-group">
                <label for="a_phone">Phone <span class="req">*</span></label>
                <input type="tel" id="a_phone" required placeholder="01XXXXXXXXX">
            </div>

            <!-- Location -->
            <div class="form-group">
                <label for="a_location">Location <span class="req">*</span></label>
                <input type="text" id="a_location" required placeholder="e.g. Dhanmondi, Dhaka">
            </div>

            <!-- Email -->
            <div class="form-group">
                <label for="a_email">Email</label>
                <input type="email" id="a_email" placeholder="donor@email.com">
            </div>

            <!-- Age & Gender in 2 columns -->
            <div class="form-row">
                <div class="form-group">
                    <label for="a_age">Age</label>
                    <input type="number" id="a_age" min="18" max="65" placeholder="18-65">
                </div>
                <div class="form-group">
                    <label for="a_gender">Gender</label>
                    <select id="a_gender">
                        <option value="">Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
            </div>

            <!-- Message -->
            <div class="form-group">
                <label for="a_message">Message</label>
                <textarea id="a_message" name="message" placeholder="Optional notes..."></textarea>
            </div>

            <!-- Form Buttons -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Donor</button>
                <button type="button" class="btn btn-ghost cancelBtn">Cancel</button>
            </div>
        </form>

    </div>
</div>
{% endblock %}
