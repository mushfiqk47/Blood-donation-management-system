{% extends "base.html" %}

{% block title %}Admin Login - BloodLife{% endblock %}

{% block content %}
<!-- ============================================================
     ADMIN LOGIN PAGE
     Allows the site administrator to log in and manage the donors.
============================================================ -->
<section class="register-section">
    <div class="container">
        <div class="form-card form-card-centered">
            
            <h1 class="text-center">Admin Login</h1>
            <p class="text-center">Access the administrator dashboard</p>

            <!-- Alert message for login errors -->
            <div id="alert" class="alert hidden" role="alert"></div>

            <!-- Login Form -->
            <form id="loginForm">
                <!-- Username -->
                <div class="form-group">
                    <label for="username">Username</label>
                    <input 
                        type="text" 
                        id="username" 
                        required 
                        placeholder="e.g. admin" 
                        autocomplete="username"
                    >
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        required 
                        placeholder="••••••••" 
                        autocomplete="current-password"
                    >
                </div>

                <!-- Submit Button -->
                <div class="form-submit">
                    <button type="submit" class="btn btn-primary btn-lg btn-block" id="loginBtn">
                        Login
                    </button>
                </div>
            </form>

            <!-- Default Credentials Hint -->
            <p class="text-center text-hint">Default: admin / admin123</p>

        </div>
    </div>
</section>
{% endblock %}
