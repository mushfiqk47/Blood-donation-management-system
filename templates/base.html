<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="BloodLife - Blood Donation Management System">
    <title>{% block title %}BloodLife - Blood Donation System{% endblock %}</title>

    <!-- Google Fonts: Inter font family for modern, clean typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Accessibility Skip Link: Allows keyboard/screen reader users to jump straight to content -->
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <!-- Top Navigation Bar -->
    <nav class="navbar" role="navigation" aria-label="Main navigation">
        <div class="container nav-container">
            <!-- Brand Logo -->
            <a href="/donors" class="logo" aria-label="BloodLife Home">
                BloodLife
            </a>

            <!-- Mobile Navigation Toggle Button -->
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu" aria-expanded="false">
                Menu
            </button>

            <!-- Navigation Links -->
            <ul class="nav-links" id="navLinks">
                <li><a href="/donors">Find Donors</a></li>
                <li><a href="/register">Become Donor</a></li>
                <li><a href="/admin" class="btn btn-primary btn-sm">Admin</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Page Content: Child templates (donors, register, admin, dashboard) inject their HTML here -->
    <main id="main-content" tabindex="-1">
        {% block content %}{% endblock %}
    </main>

    <!-- Main JavaScript File: Handles all client-side interactions -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
