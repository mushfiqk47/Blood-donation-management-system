{% extends "base.html" %}
{% block title %}Find Donors - BloodLife{% endblock %}

{% block content %}
<section class="donors-section" aria-label="Donor search">
    <div class="container">
        <div class="search-bar">
            <div class="search-input-wrap">
                <label class="search-label">Who</label>
                <input type="search" class="search-input" id="searchInput" placeholder="Search donors..." aria-label="Search donors">
            </div>
            <div class="filter-wrap">
                <label class="search-label">Blood Group</label>
                <select class="filter-select" id="bloodFilter" aria-label="Filter by blood group">
                    <option value="">All Groups</option>
                    <option value="A+">A+</option><option value="A-">A-</option>
                    <option value="B+">B+</option><option value="B-">B-</option>
                    <option value="AB+">AB+</option><option value="AB-">AB-</option>
                    <option value="O+">O+</option><option value="O-">O-</option>
                </select>
            </div>
            <div class="filter-wrap" style="border-left: 1px solid var(--hairline-soft);">
                <label class="search-label">Where</label>
                <select class="filter-select" id="locationFilter" aria-label="Filter by location">
                    <option value="">Anywhere</option>
                </select>
            </div>
            <button class="search-orb" id="searchBtn" aria-label="Search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/></svg>
            </button>
        </div>

        <div class="donors-grid" id="donorsGrid" aria-live="polite">
            <p class="loading">Searching for donors...</p>
        </div>
    </div>
</section>

<script>
function loadDonors() {
    var search = document.getElementById('searchInput').value;
    var blood = document.getElementById('bloodFilter').value;
    var location = document.getElementById('locationFilter').value;

    var url = '/api/donors?';
    if (search) url += 'search=' + encodeURIComponent(search) + '&';
    if (blood) url += 'blood=' + encodeURIComponent(blood) + '&';
    if (location) url += 'location=' + encodeURIComponent(location) + '&';

    fetch(url)
        .then(function(r) { return r.json(); })
        .then(function(donors) {
            var grid = document.getElementById('donorsGrid');
            if (donors.length === 0) {
                grid.innerHTML = '<div class="empty-state"><div class="empty-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" x2="16.65" y1="21" y2="16.65"/></svg></div><p>No donors found.</p></div>';
                return;
            }
            grid.innerHTML = donors.map(function(d) {
                return '<div class="donor-card">' +
                    '<div class="donor-card-top">' +
                        '<div class="donor-avatar-sm">' + d.name.charAt(0) + '</div>' +
                        '<div class="donor-card-header">' +
                            '<div class="donor-name">' + d.name + '</div>' +
                            '<span class="donor-blood-badge-sm">' + d.blood_group + '</span>' +
                        '</div>' +
                    '</div>' +
                    '<div class="donor-card-details">' +
                        '<div class="donor-detail-row">' +
                            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>' +
                            '<span>' + d.phone + '</span>' +
                        '</div>' +
                        '<div class="donor-detail-row">' +
                            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>' +
                            '<span>' + d.location + '</span>' +
                        '</div>' +
                    '</div>' +
                    '<div class="donor-card-actions">' +
                        '<a href="tel:' + d.phone + '" class="btn btn-primary btn-sm" onclick="event.stopPropagation()">Call</a>' +
                        '<a href="/donor/' + d.id + '" class="btn btn-outline btn-sm" onclick="event.stopPropagation()">View Profile</a>' +
                    '</div>' +
                '</div>';
            }).join('');
        });
}

fetch('/api/stats')
    .then(function(r) { return r.json(); })
    .then(function(data) {
        var sel = document.getElementById('locationFilter');
        data.locations.forEach(function(loc) {
            sel.innerHTML += '<option value="' + loc + '">' + loc + '</option>';
        });
    });

var urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('blood')) document.getElementById('bloodFilter').value = urlParams.get('blood');

document.getElementById('searchInput').addEventListener('input', loadDonors);
document.getElementById('bloodFilter').addEventListener('change', loadDonors);
document.getElementById('locationFilter').addEventListener('change', loadDonors);

loadDonors();
</script>
{% endblock %}
