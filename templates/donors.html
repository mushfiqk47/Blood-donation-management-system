{% extends "base.html" %}

{% block title %}Find Donors - BloodLife{% endblock %}

{% block content %}
<!-- ============================================================
     FIND DONORS PAGE
     Allows users to search donors by name/location/phone and
     filter them by blood group.
============================================================ -->
<section class="donors-section" aria-label="Donor search and results">
    <div class="container">

        <!-- Search and Filter Control Bar -->
        <div class="search-bar">
            <!-- Keyword Search Input -->
            <div class="search-input-wrap">
                <label class="search-label" for="searchInput">Search Donors</label>
                <input 
                    type="search" 
                    class="search-input" 
                    id="searchInput" 
                    placeholder="Search by name, location, or phone..." 
                    aria-label="Search donors"
                >
            </div>

            <!-- Blood Group Quick Filter Buttons -->
            <div class="filter-wrap">
                <span class="search-label">Blood Group</span>
                <div class="blood-btn-group" id="bloodBtns" role="group" aria-label="Filter by blood group">
                    <button type="button" class="blood-btn active" data-blood="">All</button>
                    <button type="button" class="blood-btn" data-blood="A+">A+</button>
                    <button type="button" class="blood-btn" data-blood="A-">A-</button>
                    <button type="button" class="blood-btn" data-blood="B+">B+</button>
                    <button type="button" class="blood-btn" data-blood="B-">B-</button>
                    <button type="button" class="blood-btn" data-blood="AB+">AB+</button>
                    <button type="button" class="blood-btn" data-blood="AB-">AB-</button>
                    <button type="button" class="blood-btn" data-blood="O+">O+</button>
                    <button type="button" class="blood-btn" data-blood="O-">O-</button>
                </div>
            </div>

            <!-- Search Action Button -->
            <button class="btn btn-primary search-btn" id="searchBtn" type="button" aria-label="Search">
                Search
            </button>
        </div>

        <!-- Donors Results Table -->
        <div class="table-container" aria-live="polite">
            <table class="data-table donors-table">
                <!-- Column widths definition for consistent table layout -->
                <colgroup>
                    <col class="col-name">
                    <col class="col-blood">
                    <col class="col-phone">
                    <col class="col-email">
                    <col class="col-location">
                    <col class="col-age">
                    <col class="col-gender">
                    <col class="col-msg">
                    <col class="col-actions">
                </colgroup>
                <thead>
                    <tr>
                        <th scope="col">Name</th>
                        <th scope="col">Blood Group</th>
                        <th scope="col">Phone</th>
                        <th scope="col">Email</th>
                        <th scope="col">Location</th>
                        <th scope="col">Age</th>
                        <th scope="col">Gender</th>
                        <th scope="col">Message</th>
                        <th scope="col">Contact</th>
                    </tr>
                </thead>
                <!-- Table rows are dynamically populated via JavaScript fetch to /api/donors -->
                <tbody id="donorsBody">
                    <tr>
                        <td colspan="9" class="loading">Searching for donors...</td>
                    </tr>
                </tbody>
            </table>
        </div>

    </div>
</section>
{% endblock %}
